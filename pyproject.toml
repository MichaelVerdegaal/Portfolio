[project]
name = "portfolio"
version = "1.0.0"
description = "3D graph visualizer using Matplotlib"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import sorting (I), bugbear (B), and pyupgrade (UP).
extend-select = ["I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
graph = [
    "fa2>=1.1.2",
    "matplotlib==3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
]
serve = ["fastapi>=0.141.1", "uvicorn[standard]>=0.30.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
