[project]
name = "portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.137.2",
    "matplotlib==3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
]

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import sorting (I), bugbear (B), and pyupgrade (UP).
extend-select = ["I", "B", "UP"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
