<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Portfolio</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				background: #101010;
			}

			.hero {
				position: relative;
				width: 100%;
				height: 100vh;
				overflow: hidden;
				background: #101010 url("/static/hero-poster.png") center / cover no-repeat;
			}

			.hero__video {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}

			.hero__video--hidden {
				display: none;
			}

			@media (prefers-reduced-motion: reduce) {
				.hero__video {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<section class="hero">
			<video
				class="hero__video"
				id="intro"
				autoplay
				muted
				playsinline
				controls
				preload="auto"
				poster="/static/hero-poster.png"
			>
				<source src="/video/hero-intro.mp4" type="video/mp4" />
			</video>
			<video
				class="hero__video hero__video--hidden"
				id="loop"
				muted
				playsinline
				loop
				preload="auto"
			>
				<source src="/video/hero-loop.mp4" type="video/mp4" />
			</video>
		</section>

		<script>
			const intro = document.getElementById("intro");
			const loop = document.getElementById("loop");

			intro.addEventListener(
				"ended",
				() => {
					loop.play();
					loop.addEventListener(
						"playing",
						() => {
							loop.classList.remove("hero__video--hidden");
							intro.classList.add("hero__video--hidden");
						},
						{ once: true }
					);
				},
				{ once: true }
			);

			["intro", "loop"].forEach((id) => {
				const v = document.getElementById(id);
				v.addEventListener("error", () => console.error(id, "error", v.error));
				v.addEventListener("stalled", () => console.warn(id, "stalled"));
				v.addEventListener("waiting", () => console.warn(id, "waiting"));
				v.play().catch((e) => console.error(id, "play() failed", e));
			});
		</script>
	</body>
</html>
