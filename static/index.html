<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Michael Verdegaal - Portfolio</title>
		<meta
			name="description"
			content="Michael Verdegaal - ML/AI Engineer, Software Dev and more!"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			:root {
				--bg: #0f1010;
				--ink: #f4f2ee;
				--muted: #6a6a6a;
				--dim: #c5c5c5;
				--accent: #ff8f40;
				--accent-press: #cf6a24;
				--line: #2a2a2a;
				--panel-bg: rgba(10, 10, 10, 0.88);
			}

			body {
				margin: 0;
				background: var(--bg);
				font-family: "JetBrains Mono", ui-monospace, monospace;
				color: var(--ink);
			}

			.hero {
				position: relative;
				width: 100%;
				height: 100svh;
				min-height: 640px;
				overflow: hidden;
				background: var(--bg) url("/static/hero-poster.webp") center / cover no-repeat;
			}

			.hero__video {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: center;
				opacity: 0;
				transition: opacity 600ms ease;
			}

			.hero__video--visible {
				opacity: 1;
			}

			.hero__overlay {
				position: absolute;
				inset: 0;
				background: rgba(15, 16, 16, 0.18);
				pointer-events: none;
			}

			.hero__content {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0 clamp(20px, 4vw, 64px);
			}

			.hero__card {
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
				gap: 26px;
				max-width: 600px;
				width: 100%;
				padding: 32px clamp(20px, 3vw, 40px);
				background: var(--panel-bg);
				backdrop-filter: blur(14px);
				-webkit-backdrop-filter: blur(14px);
				border: 1px solid var(--line);
			}

			.hero__title-block {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
			}

			.hero__title {
				margin: 0;
				font-size: clamp(28px, 3.2vw, 42px);
				font-weight: 700;
				color: var(--ink);
				letter-spacing: -0.5px;
				line-height: 1.15;
			}

			.hero__subtitle {
				margin: 0;
				font-size: 13px;
				line-height: 1.6;
				color: var(--muted);
				letter-spacing: 0.04em;
			}

			.hero__links {
				display: flex;
				justify-content: center;
				gap: 14px;
				width: 100%;
			}

			.hero__link {
				display: flex;
				flex: 1 1 0;
				flex-direction: column;
				align-items: center;
				gap: 10px;
				padding: 16px 12px;
				border: 1px solid var(--line);
				color: var(--dim);
				font-size: 13px;
				min-width: 0;
				text-decoration: none;
				transition:
					background 150ms ease,
					color 150ms ease;
			}

			.hero__link:hover {
				background: rgba(255, 255, 255, 0.04);
				color: var(--ink);
			}

			.hero__link:active {
				background: rgba(255, 255, 255, 0.07);
			}

			.hero__link svg {
				display: block;
			}

			.hero__footnote {
				margin: 0;
				font-size: 13px;
				line-height: 1.6;
				color: var(--muted);
			}

			.hero__footnote a {
				color: var(--accent);
				text-decoration: none;
				transition:
					background 150ms ease,
					color 150ms ease;
			}

			.hero__footnote a:hover {
				color: var(--bg);
				background: var(--accent);
			}

			.hero__footnote a:active {
				color: var(--bg);
				background: var(--accent-press);
			}

			@media (prefers-reduced-motion: reduce) {
				.hero__video {
					display: none;
				}
			}

			@media (max-width: 520px) {
				.hero__links {
					gap: 10px;
				}

				.hero__link {
					padding: 14px 8px;
					font-size: 12px;
				}
			}
		</style>
	</head>
	<body>
		<section class="hero">
			<video
				class="hero__video"
				id="hero-loop"
				autoplay
				muted
				loop
				playsinline
				preload="auto"
				poster="/static/hero-poster.webp"
			>
				<source src="/static/hero-loop.mp4" type="video/mp4" />
			</video>

			<div class="hero__overlay" aria-hidden="true"></div>

			<div class="hero__content">
				<div class="hero__card">
					<div class="hero__title-block">
						<h1 class="hero__title">Michael Verdegaal</h1>
						<p class="hero__subtitle">
							ML Engineer / AI Engineer / Software Dev / Platform Architect
						</p>
					</div>

					<div class="hero__links">
						<a
							href="https://github.com/MichaelVerdegaal"
							target="_blank"
							rel="noreferrer"
							class="hero__link"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#ff8f40"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<path
									d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
								></path>
								<path d="M9 18c-4.51 2-5-2-7-2"></path>
							</svg>
							<span>Github</span>
						</a>

						<a href="mailto:work@mverdegaal.com" class="hero__link">
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#ff8f40"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<rect width="20" height="16" x="2" y="4"></rect>
								<path d="m2 7 10 6 10-6"></path>
							</svg>
							<span>E-mail me</span>
						</a>

						<a
							href="https://www.linkedin.com/in/michael-verdegaal-2b8353164/"
							target="_blank"
							rel="noreferrer"
							class="hero__link"
						>
							<svg
								width="22"
								height="22"
								viewBox="0 0 24 24"
								fill="none"
								stroke="#ff8f40"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<path
									d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-11h4v1.5A4 4 0 0 1 16 8z"
								></path>
								<rect width="4" height="12" x="2" y="9"></rect>
								<circle cx="4" cy="4" r="2"></circle>
							</svg>
							<span>LinkedIn</span>
						</a>
					</div>

					<p class="hero__footnote">
						Made entirely with Matplotlib!
						<a
							href="https://github.com/MichaelVerdegaal/Portfolio"
							target="_blank"
							rel="noreferrer"
							>Click here to figure out how</a
						>
					</p>
				</div>
			</div>
		</section>

		<script>
			const heroVideo = document.getElementById("hero-loop");

			heroVideo.addEventListener(
				"playing",
				() => heroVideo.classList.add("hero__video--visible"),
				{ once: true }
			);

			// Autoplay is blocked by Windows "reduced interactivity" and by iOS low
			// power mode. The poster is already painted on .hero, so a rejected
			// play() needs no handling beyond not throwing.
			heroVideo.play().catch(() => {});
		</script>
	</body>
</html>
