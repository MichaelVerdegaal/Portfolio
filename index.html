<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael — Portfolio</title>
  <meta name="description" content="Michael's personal portfolio — data engineering, ML, and more.">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', sans-serif;
    }

    /* ─── Canvas ─────────────────────────────────────────────────── */
    #point-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ─── Centre Button ──────────────────────────────────────────── */
    #reveal-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #000;
      background: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.6s ease, background 0.2s ease, transform 0.2s ease;
    }

    #reveal-btn:hover {
      background: #ccc;
      transform: translate(-50%, -50%) scale(1.05);
    }

    #reveal-btn:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    /* ─── Logo Overlay ───────────────────────────────────────────── */
    #logo-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #logo-overlay .logo-link {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #logo-overlay .logo-link:hover {
      transform: scale(1.15);
      transition: transform 0.2s ease;
    }

    /* ─── Accessibility: visually hidden but available to SR ────── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ─── Static Fallback (reduced motion) ───────────────────────── */
    #static-fallback {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: #000;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #static-fallback h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 700;
      text-align: center;
    }

    #static-fallback .static-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    #static-fallback .static-links a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      transition: border-color 0.2s;
    }

    #static-fallback .static-links a:hover {
      border-color: #fff;
    }

    #static-fallback .static-links a img {
      width: 20px;
      height: 20px;
      filter: brightness(0) invert(1);
    }
  </style>
</head>
<body>
  <!-- Main canvas for particle rendering -->
  <canvas id="point-canvas" aria-hidden="true"></canvas>

  <!-- Reveal button -->
  <button id="reveal-btn" aria-label="Reveal name">Discover</button>

  <!-- Logo overlay container -->
  <div id="logo-overlay" aria-hidden="true"></div>

  <!-- Accessible content for screen readers and SEO -->
  <main id="sr-content" class="sr-only">
    <h1>Michael</h1>
    <nav aria-label="Social links">
      <ul>
        <li><a href="https://github.com/michael">GitHub</a></li>
        <li><a href="https://linkedin.com/in/michael">LinkedIn</a></li>
        <li><a href="mailto:michael@example.com">Email</a></li>
      </ul>
    </nav>
  </main>

  <!-- Static fallback for prefers-reduced-motion -->
  <div id="static-fallback" aria-label="Portfolio">
    <h1>Michael</h1>
    <div class="static-links">
      <a href="https://github.com/michael" target="_blank" rel="noopener noreferrer">
        <img src="assets/logos/github.svg" alt="">
        GitHub
      </a>
      <a href="https://linkedin.com/in/michael" target="_blank" rel="noopener noreferrer">
        <img src="assets/logos/linkedin.svg" alt="">
        LinkedIn
      </a>
      <a href="mailto:michael@example.com">
        <img src="assets/logos/email.svg" alt="">
        Email
      </a>
    </div>
  </div>

  <!-- Application entry point -->
  <script type="module" src="main.js"></script>
</body>
</html>
