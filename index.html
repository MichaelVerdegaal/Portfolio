<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael — Portfolio</title>
  <meta name="description" content="Michael's personal portfolio — data engineering, ML, and more.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='white'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
    }

    #point-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #reveal-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #000;
      background: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.6s ease, background 0.2s ease, transform 0.2s ease;
      will-change: opacity;
      -webkit-tap-highlight-color: transparent;
    }

    #reveal-btn:hover {
      background: #ccc;
      transform: translate(-50%, -50%) scale(1.05);
    }

    #reveal-btn:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    #logo-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #logo-overlay .logo-link {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #logo-overlay .logo-link:hover {
      transform: scale(1.15);
      transition: transform 0.2s ease;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #static-fallback {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: #000;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #static-fallback h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 700;
      text-align: center;
    }

    #static-fallback .static-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    #static-fallback .static-links a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      transition: border-color 0.2s;
    }

    #static-fallback .static-links a:hover {
      border-color: #fff;
    }

    #static-fallback .static-links a img {
      width: 20px;
      height: 20px;
      filter: brightness(0) invert(1);
    }

    /* ─── Controls Panel ─────────────────────────────────────────── */
    #controls {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 50;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 12px 16px;
      color: #eee;
      font-size: 12px;
      font-family: 'Inter', monospace;
      min-width: 220px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #controls summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.03em;
      user-select: none;
      list-style: none;
    }

    #controls summary::-webkit-details-marker { display: none; }
    #controls summary::before {
      content: '▸ ';
    }
    #controls[open] summary::before {
      content: '▾ ';
    }

    #controls label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      gap: 8px;
    }

    #controls select,
    #controls input[type="number"] {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      padding: 3px 6px;
      font-size: 12px;
      font-family: monospace;
      width: 90px;
    }

    #controls select {
      width: 100px;
    }

    #controls button {
      margin-top: 12px;
      width: 100%;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    #controls button:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    #param-fields {
      margin-top: 6px;
    }

    /* ─── Loss Counter ───────────────────────────────────────────── */
    #loss-counter {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 50;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'Inter', monospace;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>
  <canvas id="point-canvas" aria-hidden="true"></canvas>

  <!-- Loss counter -->
  <div id="loss-counter" aria-hidden="true"></div>

  <!-- Controls panel -->
  <details id="controls" open>
    <summary>Controls</summary>
    <label>
      Optimizer
      <select id="ctrl-optimizer">
        <option value="pso">PSO</option>
        <option value="adam">Adam</option>
        <option value="sgd">SGD</option>
        <option value="rmsprop">RMSProp</option>
        <option value="muon">Muon</option>
      </select>
    </label>
    <div id="param-fields"></div>
    <button id="ctrl-reset" type="button">Reset</button>
  </details>

  <button id="reveal-btn" aria-label="Reveal name">Discover</button>

  <div id="logo-overlay" aria-hidden="true"></div>

  <!-- Accessible content for screen readers and SEO -->
  <main id="sr-content" class="sr-only">
    <h1>Michael</h1>
    <nav aria-label="Social links">
      <ul>
        <li><a href="https://github.com/michael">GitHub</a></li>
        <li><a href="https://linkedin.com/in/michael">LinkedIn</a></li>
        <li><a href="mailto:michael@example.com">Email</a></li>
      </ul>
    </nav>
  </main>

  <!-- Static fallback for prefers-reduced-motion -->
  <div id="static-fallback" aria-label="Portfolio">
    <h1>Michael</h1>
    <div class="static-links">
      <a href="https://github.com/MichaelVerdegaal" target="_blank" rel="noopener noreferrer">
        <img src="assets/logos/github.svg" alt="">
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/michael-verdegaal-2b8353164/" target="_blank" rel="noopener noreferrer">
        <img src="assets/logos/linkedin.svg" alt="">
        LinkedIn
      </a>
      <a href="mailto:mverdegaal@protonmail.com">
        <img src="assets/logos/email.svg" alt="">
        Email
      </a>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
